<script>
let M=[],sportKey='basketball_nba',SB=[],sourceJob={status:'idle',errors:[]},sourceBusy=false,sourceTimer=null,sourceAutoPick=true;
const START=1000,KEY='nbaBook1';
let S={bal:START,bets:[]},slip=[],mode='single',view=null,cur=null,stake=50,err='',leagueCat='regular';
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
S.margin=0;

const $=id=>document.getElementById(id),save=()=>{if(window.queueAccountSave&&accountUser){window.queueAccountSave();return;}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const f=n=>(Math.round(n*100)/100).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pay=b=>b.st==='won'?b.stake*b.odds:b.st==='push'?b.stake:0;
const selectionGroup=(m,o)=>[m.id,o[2]?.t||'custom',o[2]?.marketId||'',o[2]?.player||'',o[2]?.stat||'',o[2]?.t==='sp'?Math.abs(o[2].pt):o[2]?.pt??''].join('|');
const selectionKey=(m,o)=>[selectionGroup(m,o),o[2]?.team||o[2]?.side||o[2]?.participant||o[0],o[2]?.bookKey||''].join('|');
const inSlip=k=>slip.some(s=>s.k===k);

function render(){
 const marketState=lastView===view?new Map([...$('main').querySelectorAll('details')].map(d=>[d.querySelector('summary').textContent,d.open])):null;

  if(lastView!==view){lastView=view;const mm=$('main');mm.classList.remove('fx');void mm.offsetWidth;mm.classList.add('fx')}
  $('bal').textContent=f(S.bal)+' zł';
  const prof=S.bets.reduce((a,b)=>a+(b.st==='won'?b.stake*(b.odds-1):b.st==='lost'?-b.stake:0),0);
  $('pl').textContent=(prof>0?'+':'')+f(prof)+' zł';$('pl').style.color=prof>0?'var(--win)':prof<0?'var(--lose)':'';
  const staked=S.bets.filter(b=>b.st==='won'||b.st==='lost').reduce((a,b)=>a+b.stake,0),y=staked?prof/staked*100:null;
  $('yl').textContent=y===null?'–':(y>0?'+':'')+f(y)+'%';$('yl').style.color=y>0?'var(--win)':y<0?'var(--lose)':'';
  $('cnt').textContent=slip.length?`Kupon (${slip.length})`:'';
  const open=S.bets.filter(b=>b.st==='open').length;
  const isM=!['bets','stats','new'].includes(view);if(isM)cur=view;
  $('menu').innerHTML=[['games','Mecze',IC.g],['bets','Moje kupony',IC.b],['stats','Statystyki',IC.s]].map(([k,t,ic])=>`<button class="mi ${k==='bets'&&open?'has-count':''} ${(k==='games'?(isM||view==='new'):view===k)?'on':''}" data-v="${k==='games'?(cur||'bets'):k}"><span class="menu-icon">${ic}</span><span class="menu-label">${t}</span>${k==='bets'&&open?`<span class="menu-count" aria-label="Otwarte kupony: ${open}">${open}</span>`:''}</button>`).join('');
  const regular=M.filter(m=>!m.preseason&&(!m.sportKey||m.sportKey==='basketball_nba')),pre=M.filter(m=>m.preseason),shown=leagueCat==='preseason'?pre:regular;
  $('cats').innerHTML=(isM||view==='new')?`<button class="chip ${leagueCat==='regular'?'on':''}" data-cat="regular">NBA (${regular.length})</button><button class="chip ${leagueCat==='preseason'?'on':''}" data-cat="preseason">Preseason (${pre.length})</button>`:'';
  $('nav').innerHTML=(isM||view==='new')?shown.map(m=>`<button class="mc ${view===m.id?'on':''}" data-v="${m.id}">${bdg(m.h,1)}${bdg(m.a,1)}<span><b>${esc(L(m.h))} – ${esc(L(m.a))}</b>${m.preseason?'<em class="badge-pre">PRESEASON</em>':''}<small>${tt(m.t)}</small></span></button>`).join('')+'<button class="mc'+(view==='new'?' on':'')+'" data-v="new"><b>+ Własny mecz</b></button>':'';
    $('main').innerHTML=(view==='bets'?bets():view==='stats'?stats():view==='new'?newForm():(M.find(m=>m.id===view)?match(M.find(m=>m.id===view)):'<div class="box empty">Brak meczów. Dodaj własny przyciskiem „+ Własny mecz”.</div>'));
  if(marketState)$('main').querySelectorAll('details').forEach(d=>{const title=d.querySelector('summary').textContent;if(marketState.has(title))d.open=marketState.get(title)});
  renderOddsControls();
  renderSlip();
  if(motionAllowed()){
    const nodes=$('slip').querySelectorAll('.leg');
    slip.forEach((s,i)=>{if(!lastSlipKeys.has(s.k)&&nodes[i])nodes[i].animate([{opacity:0,transform:'translateX(16px)'},{opacity:1,transform:'translateX(0)'}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'});});
    if(open!==lastOpenCount){const count=$('menu').querySelector('.menu-count');if(count)count.animate([{transform:'scale(.65)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:320,easing:'ease-out'});}
    if(lastBalance!==null&&S.bal!==lastBalance)$('bal').animate([{transform:'scale(1)'},{transform:'scale(1.08)',color:'var(--blue)'},{transform:'scale(1)'}],{duration:380,easing:'ease-out'});
  }
  lastSlipKeys=new Set(slip.map(s=>s.k));lastOpenCount=open;lastBalance=S.bal;
}
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const tt=t=>isNaN(new Date(t))?t:new Date(t).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'});
const AB={Hawks:'atl',Celtics:'bos',Nets:'bkn',Hornets:'cha',Bulls:'chi',Cavaliers:'cle',Mavericks:'dal',Nuggets:'den',Pistons:'det',Warriors:'gs',Rockets:'hou',Pacers:'ind',Clippers:'lac',Lakers:'lal',Grizzlies:'mem',Heat:'mia',Bucks:'mil',Timberwolves:'min',Pelicans:'no',Knicks:'ny',Thunder:'okc',Magic:'orl','76ers':'phi',Suns:'phx',Blazers:'por',Kings:'sac',Spurs:'sa',Raptors:'tor',Jazz:'utah',Wizards:'wsh'};
const bdg=(n,sm)=>{const k=n.split(' ').pop(),ab=AB[k];return `<span class="bdg ${sm?'s':''}${ab?'':' nologo'}" data-t="${esc(k.slice(0,3).toUpperCase())}" style="--c:hsl(${hue(n)} 55% 42%)">${ab?`<img src="https://a.espncdn.com/i/teamlogos/nba/500/${ab}.png" alt="${k}" loading="lazy" onerror="this.parentNode.classList.add('nologo');this.remove()">`:''}</span>`};
const IC={g:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/></svg>',b:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14a2 2 0 0 1 2 2v3a3 3 0 0 0 0 6v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a3 3 0 0 0 0-6V6a2 2 0 0 1 2-2z"/><path d="M14 8v8" stroke-dasharray="2 2.5"/></svg>',s:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-9M12 20V4M19 20v-6"/></svg>'};

function newForm(){
  const d=new Date(Date.now()+864e5);d.setMinutes(0);const v=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  const N=(id,ph)=>`<input id="${id}" type="number" step="0.01" placeholder="${ph}" style="flex:1 1 90px">`;
  return `<div class="box mh"><h2 style="margin:0 0 4px">Własny mecz</h2><span>Przepisz mecz i kursy z Twojego bukmachera, np. mecz przedsezonowy. Zakłady na niego rozliczasz ręcznie.</span></div>
  <div class="box"><div class="cust"><input id="nh" placeholder="Gospodarze (np. Charlotte Hornets)" style="flex:1 1 220px"><input id="na" placeholder="Goście (np. Brooklyn Nets)" style="flex:1 1 220px"><input id="nt" type="datetime-local" value="${v}" style="flex:1 1 220px"></div>

  <div class="cust"><b style="flex:1 1 100%">Handicap – linia gospodarzy, np. -3.5</b>${N('hl','Linia')}${N('h1','Kurs gospodarzy')}${N('h2','Kurs gości')}</div>

}
function addMatch(){
  const g=id=>$(id).value.trim(),n=id=>parseFloat($(id).value),ok=x=>x>1;
  const h=g('nh'),a=g('na'),t=g('nt');if(!h||!a||!t)return alert('Wpisz obie drużyny i datę.');
  const mk=[],sh=L(h),sa=L(a),sg=x=>(x>0?'+':'')+x;
  if(ok(n('m1'))&&ok(n('m2')))mk.push(['Zwycięzca (z dogrywką)',[[h,n('m1'),{t:'ml',team:h}],[a,n('m2'),{t:'ml',team:a}]]]);
  const hl=n('hl');if(!isNaN(hl)&&ok(n('h1'))&&ok(n('h2')))mk.push(['Handicap (z dogrywką)',[[sh+' '+sg(hl),n('h1'),{t:'sp',team:h,pt:hl}],[sa+' '+sg(-hl),n('h2'),{t:'sp',team:a,pt:-hl}]]]);
  const tl=n('tl');if(!isNaN(tl)&&ok(n('t1'))&&ok(n('t2')))mk.push(['Suma punktów meczu',[['Powyżej '+tl,n('t1'),{t:'tot',side:'over',pt:tl}],['Poniżej '+tl,n('t2'),{t:'tot',side:'under',pt:tl}]]]);
  if(!Number.isFinite(Date.parse(t)))return alert('Wpisz poprawną datę.');
  const preseason=$('nseason').value==='preseason';const ev={id:'c'+Date.now()+Math.random().toString(16).slice(2),h,a,t:new Date(t).toISOString(),mk,custom:true,preseason,sportKey:preseason?'basketball_nba_preseason':'basketball_nba',book:'Kursy wpisane ręcznie',manualSettlement:true};
  (S.custom=S.custom||[]).push(ev);M.push(ev);M.sort((x,y)=>new Date(x.t)-new Date(y.t));save();view=ev.id;leagueCat=preseason?'preseason':'regular';render();
}
let lastView,lastSlipKeys=new Set(),lastOpenCount=0,lastBalance=null;
const motionAllowed=()=>!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function probBar(m){const k=m.mk.find(x=>/^Zwycięzca/.test(x[0]));if(!k||k[1].length!==2)return '';const a=1/k[1][0][1],b=1/k[1][1][1],p=Math.round(a/(a+b)*100);
 return `<div class="box pbx"><small style="color:var(--mute)">Szansa wg oferowanych kursów (po normalizacji marży)</small><div class="pb"><span>${esc(L(m.h))} ${p}%</span><div><i style="width:${p}%"></i></div><span>${100-p}% ${esc(L(m.a))}</span></div></div>`}
const PID={};
const nk=s=>s.normalize('NFD').replace(/[\u0300-\u036f.'’\-\s]/g,'').toLowerCase();
const plName=t=>{const x=(t||'').split(' – ');return x.length>1&&/^(Punkty|Zbiórki|Asysty)/.test(x[0])?x[1]:null};
const av=n=>{const id=PID[nk(n)],ini=n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();return `<span class="av${id?'':' noph'}" data-t="${esc(ini)}">${id?`<img src="https://cdn.nba.com/headshots/nba/latest/260x190/${id}.png" alt="" loading="lazy" onerror="this.parentNode.classList.add('noph');this.remove()">`:''}</span>`};
function adjMk(m){return m.base||m.mk;}
const reM=()=>M.forEach(m=>{m.base=m.base||m.mk;m.mk=adjMk(m)});
function renderOddsControls(){
 const errors=sourceJob.errors||[];$('oddsPanel').innerHTML=errors.length?`<details class="source-error"><summary>Nie udało się pobrać części kursów</summary>${errors.map(e=>`<p>${esc(e.scope)}: ${esc(e.message)}</p>`).join('')}</details>`:'';
 $('offlineImport').onchange=e=>{if(e.target.files[0])importMatches(e.target.files[0]);};
}
async function sourceApi(method='GET'){
 const r=await fetch('/api/superbet',{method}),j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j;
}
function applySource(j){
 sourceJob=j;sourceBusy=j.status==='running';const editing=document.activeElement?.closest('.cust');const next=(j.events||[]).filter(e=>Date.parse(e.t)>Date.now());SB=j.status==='running'?[...new Map([...SB,...next].map(e=>[e.id,e])).values()]:next;
 M=SB.concat(S.custom||[]).sort((a,b)=>Date.parse(a.t)-Date.parse(b.t));
 if(!['bets','stats','new'].includes(view)&&!M.some(e=>e.id===view))cur=view=M.find(e=>leagueCat==='preseason'?e.preseason:!e.preseason)?.id||'new';
 if(sourceAutoPick&&view==='new'&&SB.length&&!editing){cur=view=SB[0].id;leagueCat=SB[0].preseason?'preseason':'regular';sourceAutoPick=false;}
 if(editing)renderOddsControls();else render();
 if(sourceTimer)clearTimeout(sourceTimer);sourceTimer=null;
 if(sourceBusy)sourceTimer=setTimeout(pollSource,2000);
}
async function pollSource(){try{applySource(await sourceApi())}catch(e){sourceBusy=false;sourceJob={...sourceJob,status:'stopped',errors:[{scope:'Połączenie',message:e.message}]};render();}}
async function refreshSource(){if(sourceBusy)return;sourceBusy=true;renderOddsControls();try{applySource(await sourceApi('POST'))}catch(e){sourceBusy=false;sourceJob={status:'stopped',errors:[{scope:'Superbet',message:e.message}]};render();}}
function quoteFresh(meta){return meta?.bookKey!=='superbet'||Number.isFinite(Date.parse(meta.updatedAt))&&Date.now()-Date.parse(meta.updatedAt)<10*60e3;}
function extraMarketForm(){
 return `<div class="box"><div class="mh"><b>Dodaj propsy lub inny rynek</b><br><small>Przepisz aktualny kurs. Obsługiwany jest dowolny opis rynku, np. punkty, trójki, PRA, kwarta, połowa, handicap lub dokładny wynik.</small></div><div class="cust"><select id="rk"><option>Zawodnik</option><option>Drużyna</option><option>Mecz</option><option>1. kwarta</option><option>2. kwarta</option><option>3. kwarta</option><option>4. kwarta</option><option>1. połowa</option><option>2. połowa</option><option>Inny rynek</option></select><input id="rp" placeholder="Zawodnik / drużyna (opcjonalnie)"><input id="rn" placeholder="Rynek, np. Punkty + zbiórki + asysty"></div><div class="cust"><input id="ro" placeholder="Typ, np. Powyżej 35.5 / Tak"><input id="rc" type="number" min="1.01" step="0.01" placeholder="Kurs"><button class="go" data-market="1">Dodaj typ do oferty meczu</button></div><small style="display:block;padding:0 16px 16px;color:var(--mute)">Ten sam rynek i zawodnik są grupowani razem. Dla innej linii wpisz ją również w nazwie rynku, np. „Punkty 25.5”.</small></div>`;
}
function addMarket(){
 const m=M.find(x=>x.id===view),name=$('rn').value.trim(),person=$('rp').value.trim(),pick=$('ro').value.trim(),price=Number($('rc').value),kind=$('rk').value;
 if(!m||!name||!pick||!Number.isFinite(price)||price<=1)return alert('Podaj nazwę rynku, typ oraz kurs większy niż 1.');
 const title=kind+' · '+name+(person?' – '+person:'');
 let group=m.mk.find(k=>k[0]===title);if(!group){group=[title,[]];m.mk.push(group);}
 const option=[pick,price,{t:'custom',marketId:title,book:'Wpisany ręcznie'}];
 if(m.source==='superbet')return alert('W meczu Superbet użyj pola Własny typ poniżej albo utwórz mecz ręczny. Oferta automatyczna jest odświeżana ze źródła.');const idx=group[1].findIndex(o=>o[0]===pick);if(idx<0)group[1].push(option);else group[1][idx]=option;
 delete m.base;const pos=(S.custom||[]).findIndex(e=>e.id===m.id);if(pos<0)(S.custom=S.custom||[]).push(m);else S.custom[pos]=m;save();render();
}
function exportData(){
 const blob=new Blob([JSON.stringify({format:'easybet-offline-v1',matches:S.custom||[]},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='easybet-mecze.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importMatches(file){
 try{if(file.size>5*1024*1024)throw new Error('Plik przekracza 5 MB.');const j=JSON.parse(await file.text()),events=OfflineData.validateMatches(j);let added=0;
  for(const e of events){if((S.custom||[]).some(x=>x.id===e.id))continue;(S.custom=S.custom||[]).push(e);added++;}
  save();M=SB.concat(S.custom||[]).sort((a,b)=>Date.parse(a.t)-Date.parse(b.t));cur=view=events.find(e=>M.some(m=>m.id===e.id))?.id||M[0]?.id||'new';leagueCat=M.find(e=>e.id===view)?.preseason?'preseason':'regular';render();alert('Dodano meczów: '+added+'. Istniejące identyfikatory pominięto.');
 }catch(e){alert('Import nieudany: '+e.message);}
}

function stats(){
 const d=S.bets.filter(b=>b.st!=='open'),dc=d.filter(b=>b.st==='won'||b.st==='lost'),w=dc.filter(b=>b.st==='won');
 const prof=d.reduce((a,b)=>a+(b.st==='won'?b.stake*(b.odds-1):b.st==='lost'?-b.stake:0),0),stk=dc.reduce((a,b)=>a+b.stake,0),y=stk?prof/stk*100:null;
 const best=w.reduce((a,b)=>Math.max(a,b.stake*(b.odds-1)),0);
 const C=[['Saldo',f(S.bal)+' zł'],['Zysk / strata',(prof>0?'+':'')+f(prof)+' zł'],['Yield',y===null?'–':(y>0?'+':'')+f(y)+'%'],['Skuteczność',dc.length?Math.round(w.length/dc.length*100)+'%':'–'],['Rozliczone',d.length],['Otwarte',S.bets.length-d.length],['Średni kurs',S.bets.length?f(S.bets.reduce((a,b)=>a+b.odds,0)/S.bets.length):'–'],['Największa wygrana',best?'+'+f(best)+' zł':'–']];
 return `<div class="sg">${C.map(c=>`<div class="box st"><small>${c[0]}</small><b>${c[1]}</b></div>`).join('')}</div>`}
function marketCards(m){
 return MarketTools.layout(m).map(({name,rows})=>`<details class="box market-card" open><summary><span>${esc(name)}</span><small>${rows.length>1?rows.length+' linii':''}</small></summary><div class="market-lines">${rows.map(options=>`<div class="market-line" style="--cols:${Math.min(options.length,3)}">${options.map(({o,i,j})=>`<button class="od ${inSlip(selectionKey(m,o))?'on':''}" ${quoteFresh(o[2])?'':'disabled title="Nieaktualny kurs"'} data-m="${m.id}" data-i="${i}" data-j="${j}" aria-pressed="${inSlip(selectionKey(m,o))}"><span class="pick-copy">${esc(MarketTools.compact(o[0],m.mk[i][0],m))}</span><b>${f(o[1])}</b></button>`).join('')}</div>`).join('')}</div></details>`).join('');
}
function match(m){
  return `<div class="box hero"><div class="tm">${bdg(m.h)}<span>${esc(m.h)}</span></div><div class="vs"><b>vs</b><span>${esc(m.sportTitle||'NBA')}${m.preseason?' · PRESEASON':''} · ${new Date(m.t).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'})}</span>${m.book?`<span class="src">Kursy: ${esc(m.book)}</span>`:''}</div><div class="tm">${bdg(m.a)}<span>${esc(m.a)}</span></div></div>`+(m.manualSettlement&&m.source!=='superbet'?'<div class="box mh"><small>Rozpoznane typy NBA rozliczamy po końcowym wyniku. Własne i nieobsługiwane rynki rozliczysz ręcznie.</small></div>':'')+probBar(m)+(m.custom?`<div class="acts" style="margin:-4px 0 12px"><button data-dm="${m.id}">Usuń ten mecz</button></div>`:'')+
  (m.mk.length?marketCards(m):'<div class="box noodds">Brak kursów dla tego meczu.</div>')+
  (m.source==='superbet'?`<div class="box mh"><small>Odczyt ${tt(m.updatedAt)}</small></div>`:extraMarketForm())+
  `<div class="box"><div class="mh" style="padding-bottom:0"><b>Własny typ</b><br><span>Dodaj dowolny typ, np. „Wembanyama 3+ bloki”, z własnym kursem.</span></div><div class="cust"><input id="cn" placeholder="Opis typu" style="flex:2 1 180px"><input id="co" type="number" step="0.01" min="1.01" placeholder="Kurs" style="flex:1 1 80px"><button class="go" id="ca">Dodaj do kuponu</button></div></div>`;
}
function bets(){
  if(!S.bets.length)return '<div class="box empty">Nie masz jeszcze zakładów.</div>';
  return '<div class="box mh auto-note"><span>Wyniki sprawdzamy automatycznie co 5 minut. Nierozpoznane rynki i typy bez danych pozostają otwarte; możesz rozliczyć je ręcznie.</span></div>'+((typeof settlementNote==='string'&&settlementNote)?'<div class="box mh"><small>'+esc(settlementNote)+'</small></div>':'') +S.bets.slice().reverse().map(b=>{
    const lab={won:'Wygrany',lost:'Przegrany',push:'Zwrot'}[b.st];
    const col=b.st==='won'?'var(--win)':b.st==='lost'?'var(--lose)':'var(--push)';
    const res=b.st==='won'?'+'+f(b.stake*(b.odds-1)):b.st==='lost'?'−'+f(b.stake):'0,00';
    return `<div class="box cp ${b.st==='open'?'':b.st}"><div class="row"><b>${b.legs.length>1?'AKO ('+b.legs.length+')':'Pojedynczy'}</b>${b.st==='open'?'<small>Otwarty</small>':`<b style="color:${col}">${lab} ${res} zł${b.autoSettled?' · Auto':''}</b>`}</div>`+
    b.legs.map(l=>`<div class="lg2">${l.meta&&l.meta.team?bdg(l.meta.team,1):(plName(l.mk)?av(plName(l.mk)):'')}<span><b>${esc(l.label)}</b> <small>${esc(l.mk)} · ${esc(l.match)} · ${f(l.odds)}${l.meta?.book?' · '+esc(l.meta.book):''}</small></span></div>`).join('')+
    `<small>Kurs ${f(b.odds)} · stawka ${f(b.stake)} zł · wygrana ${f(b.stake*b.odds)} zł</small>
    <div class="acts">${b.st==='open'?`<button class="w" data-a="won" data-b="${b.id}">Wygrany</button><button class="l" data-a="lost" data-b="${b.id}">Przegrany</button><button class="u" data-a="push" data-b="${b.id}">Zwrot</button><button data-a="del" data-b="${b.id}">Usuń</button>`:(b.autoSettled?'':`<button data-a="undo" data-b="${b.id}">Cofnij rozliczenie</button>`)}</div></div>`}).join('');
}
function renderSlip(){
  if(!slip.length){$('slip').innerHTML='<h2>Kupon</h2><div class="empty">Brak kuponów<br><small>Kliknij kurs, aby dodać typ.</small></div>';return}
  $('slip').innerHTML=`<h2>Kupon</h2><div class="nav"><button class="chip ${mode==='single'?'on':''}" data-md="single">Pojedyncze</button><button class="chip ${mode==='acca'?'on':''}" data-md="acca">AKO</button></div>`+
  (mode==='acca'&&new Set(slip.map(SlipTools.eventKey)).size<slip.length?'<small style="display:block;color:var(--mute);margin:10px 0">Wirtualne AKO: kurs to iloczyn, bez wyceny Bet Buildera.</small>':'')+slip.map(s=>`<div class="leg"><div class="lg2">${s.meta&&s.meta.team?bdg(s.meta.team,1):(plName(s.market)?av(plName(s.market)):'')}<div><b>${esc(s.shortLabel||s.label)}</b> <span style="color:var(--blue)">${f(s.odds)}</span><small>${esc(s.market)} · ${esc(s.match)}${s.meta?.book?' · '+esc(s.meta.book):''}</small></div></div><button class="x" data-rm="${s.k}" aria-label="Usuń">×</button></div>`).join('')+
  `<div class="row" style="margin-top:12px"><label for="st">Stawka${mode==='single'&&slip.length>1?' (na każdy typ)':''}</label><input id="st" type="number" min="1" step="1" value="${stake}" style="width:48px;text-align:right"></div>
  <div class="q">${[10,50,100,250].map(v=>`<button data-q="${v}">${v}</button>`).join('')}</div>
  <div class="row"><span>Łączna stawka</span><b id="ts"></b></div><div class="row"><span>Wypłata</span><b id="tp"></b></div>
  <div class="err" id="er">${err}</div><button class="go" id="place" style="width:100%">Postaw zakład</button>`;
  totals();
}
function totals(){
  const n=mode==='single'?slip.length:1,o=mode==='single'?null:slip.reduce((a,s)=>a*s.odds,1);
  const ts=(stake||0)*n,tp=mode==='single'?slip.reduce((a,s)=>a+(stake||0)*s.odds,0):(stake||0)*o;
  if($('ts')){$('ts').textContent=f(ts)+' zł';$('tp').textContent=f(tp)+' zł'}
}
document.addEventListener('input',e=>{if(e.target.id==='st'){stake=parseFloat(e.target.value)||0;totals()}});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.source){refreshSource();return}
  if(d.market){addMarket();return}
  if(d.export){exportData();return}
  if(d.import){$('offlineImport').click();return}
  if(d.v){sourceAutoPick=false;view=d.v;const m=M.find(x=>x.id===view);if(m){sportKey=m.sportKey||'basketball_nba';leagueCat=m.preseason?'preseason':'regular'}}
  else if(d.cat){leagueCat=d.cat;sportKey=d.cat==='preseason'?'basketball_nba_preseason':'basketball_nba';const list=M.filter(m=>d.cat==='preseason'?m.preseason:!m.preseason&&(!m.sportKey||m.sportKey==='basketball_nba'));if(list.length)view=list[0].id;else view='new'}
  else if(d.m){const m=M.find(x=>x.id==d.m),i=+d.i,j=+d.j,markets=m.mk,o=markets[i][1][j],key=selectionGroup(m,o),k=selectionKey(m,o);
    if(!quoteFresh(o[2]))return alert('Kurs jest nieaktualny. Odśwież Superbet.');
    if(Date.parse(m.t)<=Date.now())return alert('Mecz już się rozpoczął.');
    const had=inSlip(k);slip=slip.filter(s=>s.mk!==key); 
    if(!had)slip.push({k,mk:key,label:o[0],shortLabel:MarketTools.compact(o[0],markets[i][0],m),odds:o[1],market:markets[i][0],match:m.h.split(' ').pop()+' – '+m.a.split(' ').pop(),meta:o[2],ev:{id:m.id,h:m.h,a:m.a,t:m.t,preseason:!!m.preseason,sport:m.sportKey||'basketball_nba'}});
    const before=slip.length;if(mode==='acca')slip=SlipTools.compatible(slip);slip.forEach(s=>s.mk2=s.market);err=before!==slip.length?'Zastąpiono powiązany typ z tego meczu.':''}
  else if(d.q){stake=+d.q}
  else if(t.id==='ns'){addMatch();return}
  else if(d.dm){if(confirm('Usunąć ten mecz z listy? Postawione zakłady zostaną.')){S.custom=(S.custom||[]).filter(x=>x.id!==d.dm);M=M.filter(x=>x.id!==d.dm);view=M.length?M[0].id:'bets';save()}}
  else if(d.rm){slip=slip.filter(s=>s.k!==d.rm)}
  else if(d.md){mode=d.md;const before=slip.length;if(mode==='acca')slip=SlipTools.compatible(slip);err=before!==slip.length?'AKO: powiązane typy zastąpiono ostatnim wyborem.':''}
  else if(t.id==='ca'){const n=$('cn').value.trim(),o=parseFloat($('co').value);if(!n||!(o>1))return alert('Podaj opis i kurs większy niż 1.');
    const m=M.find(m=>m.id===view),pick={k:'c'+Date.now(),mk:'custom:'+view+':'+n,label:n,odds:o,market:'Własny typ',match:(m?.h||'Własny')+' – '+(m?.a||''),ev:m?{id:m.id,h:m.h,a:m.a,t:m.t,preseason:!!m.preseason}:undefined};slip=slip.filter(s=>s.mk!==pick.mk);slip.push(pick);if(mode==='acca')slip=SlipTools.compatible(slip)}
  else if(t.id==='place')place();
  else if(d.a)settle(d);
  else if(t.id==='reset'){if(confirm('Usunąć wszystko i wrócić do '+START+' zł?')){S={bal:START,bets:[]};slip=[];save()}}
  else return;
  render();
});
function place(){
  const legs=slip.map(s=>({label:s.label,odds:s.odds,mk:s.market,match:s.match,meta:s.meta,ev:s.ev}));
  if(!legs.length)return err='Dodaj typ do kuponu.';
  if(mode==='acca'&&SlipTools.duplicates(slip))return err='Kupon zawiera powielone lub powiązane typy. Zmień wybór.';
  if(legs.some(l=>l.ev&&Date.parse(l.ev.t)<=Date.now()))return err='Mecz już się rozpoczął — usuń typ.';
  for(const l of legs){if(l.meta?.bookKey==='superbet'){const m=M.find(e=>e.id===l.ev?.id),current=m?.mk.flatMap(k=>k[1]).find(o=>o[2]?.quoteId===l.meta.quoteId);if(!current||!quoteFresh(current[2])||current[1]!==l.odds)return err='Oferta zmieniła się lub wygasła. Usuń typ i dodaj aktualny kurs.';}}
  if(!(stake>0))return err='Podaj stawkę.';
  if(mode==='acca'&&legs.length<2)return err='AKO wymaga co najmniej 2 typów.';
  const list=mode==='single'?legs.map(l=>({legs:[l],odds:l.odds})):[{legs,odds:legs.reduce((a,l)=>a*l.odds,1)}];
  const cost=stake*list.length;
  if(cost>S.bal)return err='Brak wystarczających środków.';
  err='';S.bal-=cost;list.forEach(b=>S.bets.push({id:Date.now()+Math.random(),legs:b.legs,odds:b.odds,stake,st:'open'}));
  slip=[];view='bets';save();
}
function settle(d){
  const b=S.bets.find(x=>String(x.id)===d.b);if(!b||b.autoSettled)return;
  if(d.a==='del'){S.bal+=b.stake;S.bets=S.bets.filter(x=>x!==b)}
  else if(d.a==='undo'){S.bal-=pay(b);b.st='open';b.odds=b.legs.reduce((a,l)=>a*l.odds,1);delete b.legResults;delete b.autoSettled;delete b.settledAt;}
  else if(b.st==='open'){delete b.autoSettled;b.st=d.a;S.bal+=pay(b)}
  save();
}
const L=s=>s.split(' ').pop();
M=(S.custom||[]).map(m=>({...m,custom:true,manualSettlement:true})).sort((a,b)=>Date.parse(a.t)-Date.parse(b.t));
cur=view=M[0]?.id||'new';leagueCat=M[0]?.preseason?'preseason':'regular';render();
refreshSource();setInterval(refreshSource,5*60*1000);setInterval(()=>{if(SB.length&&!document.activeElement?.closest('.cust'))render()},60*1000);
</script>
